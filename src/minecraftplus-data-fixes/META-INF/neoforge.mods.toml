# Code-free NeoForge mod (lowcodefml): only ships data that overrides broken files from other mods.
# Every dependency is optional with ordering = "AFTER", so this mod's data pack sorts after theirs and wins.
# What each file does: see README.txt and notes/full-v1-boot-report.md.
modLoader = "lowcodefml"
loaderVersion = "[1,)"
license = "MIT"

[[mods]]
modId = "minecraftplus_datafixes"
version = "1.0.0"
displayName = "Minecraft Plus: Data Fixes"
description = "Pack-local data fixes for Minecraft Plus: broken recipes, loot tables for unregistered blocks, physics entries for missing blocks."
authors = "Minecraft Plus"

[[dependencies.minecraftplus_datafixes]]
modId = "create"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

