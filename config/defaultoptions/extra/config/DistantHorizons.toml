# Minecraft Plus preset: only the keys that differ from DH's defaults; DH fills in the rest on first start.
_version = 5

[client]

	[client.advanced]

		[client.advanced.graphics]

			[client.advanced.graphics.quality]
				lodChunkRenderDistanceRadius = 256

[common]

	[common.multiThreading]
		# Minecraft Plus: 4 threads keep the render thread smooth (16 starved it on a 16-thread CPU, 2026-10-11)
		numberOfThreads = 4
		threadRunTimeRatio = "0.5"
